# Gold-labelled eval cases for Larkspur Freight Co. All people, companies and data are fictional.
#
# expected.category      one label, or a list when two labels are both acceptable
# expected.handoff       should a person take over?
# expected.outcomes      optional list of acceptable outcomes (processed, info_requested, archived, handoff)
# expected.fields        values to check after normalisation; null means "must be null" (not invented)
# expected.reply_must_include / reply_must_not_include   case-insensitive substrings
# expected.actions       action types that must be planned

# ---------------------------------------------------------------- quote requests
- id: lf-q01
  split: dev
  tags: [quote]
  email:
    from: dana.whitfield@brightwater-supply.example
    name: Dana Whitfield
    subject: Rate request Columbus to Indy
    received_at: "2026-11-18T09:14:00-05:00"
    body: |
      Hi Larkspur team,

      Could you quote 3 pallets, 1,800 lbs total, from our Columbus, OH warehouse to Indianapolis, IN? Standard service is fine. Dock to dock, no liftgate needed. We'd like to ship next Monday.

      Thanks,
      Dana Whitfield
      Logistics Coordinator, Brightwater Supply Co.
  expected:
    category: quote_request
    handoff: false
    fields: { origin_state: OH, destination_state: IN, weight_lbs: 1800, pallets: 3, service: standard }
    reply_must_include: ["$393.59"]
    actions: [record_row, send_reply]

