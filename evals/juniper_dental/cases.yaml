# Gold-labelled eval cases for Juniper Dental Studio. All people and data are fictional.
# Format: see evals/larkspur_freight/cases.yaml. A field value {any_of: [...]} accepts any listed value.

- id: jd-a01
  split: dev
  tags: [appointment, new_patient]
  email:
    from: chloe.bennett@mailbox.example
    name: Chloe Bennett
    subject: New patient - cleaning
    received_at: "2026-11-20T08:10:00-06:00"
    body: |
      Hi! I just moved to Madison and I'm looking for a new dentist. Could I book a cleaning? Mornings work best for me, ideally next week. I have Delta Dental PPO through work.

      Thanks,
      Chloe Bennett
  expected:
    category: appointment_request
    handoff: false
    fields: { request_type: new, patient_name: Chloe Bennett, appointment_type: cleaning, new_patient: true, preferred_time: morning }
    actions: [record_row, send_reply]

