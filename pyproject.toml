[project]
name = "mailroom"
version = "0.1.0"
description = "Config-driven email and document processing agent template for small businesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "reportlab>=4.0",
]

[project.scripts]
mailroom = "mailroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
